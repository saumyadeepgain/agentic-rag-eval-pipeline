name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # The suite never calls a model API; an empty key guarantees it cannot.
  OPENAI_API_KEY: ""

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff==0.16.9
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.deps }} deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            deps: range
          - python-version: "3.13"
            deps: pinned
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies (pyproject ranges)
        if: matrix.deps == 'range'
        run: pip install -e ".[dev]"
      - name: Install dependencies (pinned)
        if: matrix.deps == 'pinned'
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests (offline, no API keys)
        run: python -m pytest -q
      - name: Smoke run (ingest → eval naive + agentic → compare, offline)
        run: make smoke
