# Pipeline configuration variants
# Each variant is cumulative — later variants add on top of earlier ones.

defaults:
  chunk_size: 512
  chunk_overlap: 64
  chunking_strategy: recursive      # fixed | recursive
  top_k_retrieval: 10
  top_k_final: 5
  embedding_model: text-embedding-3-small
  reranker_model: BAAI/bge-reranker-v2-m3
  generator_model: gpt-4o
  grader_model: gpt-4o-mini
  max_retries: 2

variants:
  naive:
    name: "Naive RAG (Baseline)"
    description: "Fixed-size chunking, pure dense vector search, no reranking, no agentic loop"
    chunking_strategy: fixed
    retrieval_mode: dense            # dense | bm25 | hybrid
    reranking: false
    hyde: false
    agentic: false

  hybrid:
    name: "Hybrid Search"
    description: "Recursive chunking + BM25+Vector RRF fusion, no reranking"
    chunking_strategy: recursive
    retrieval_mode: hybrid
    rrf_k: 60                        # RRF constant
    bm25_weight: 0.4
    dense_weight: 0.6
    reranking: false
    hyde: false
    agentic: false

  hybrid_rerank:
    name: "Hybrid + Reranking"
    description: "Hybrid search + cross-encoder reranking on top-k candidates"
    chunking_strategy: recursive
    retrieval_mode: hybrid
    rrf_k: 60
    reranking: true
    hyde: false
    agentic: false

  agentic_full:
    name: "Agentic RAG (Full)"
    description: "Hybrid + reranking + HyDE + corrective agentic loop"
    chunking_strategy: recursive
    retrieval_mode: hybrid
    rrf_k: 60
    reranking: true
    hyde: true
    agentic: true
    max_retries: 2

domains:
  finance:
    ragbench_config: finqa
    description: "Financial QA — requires numerical reasoning"
    sample_size: 50

  biomedical:
    ragbench_config: pubmedqa
    description: "PubMed biomedical research QA"
    sample_size: 50

  legal:
    ragbench_config: cuad
    description: "Contract Understanding Atticus Dataset (legal)"
    sample_size: 50

evaluation:
  ragas_metrics:
    - faithfulness
    - answer_relevancy
    - context_precision
    - context_recall
  save_results_path: ./results/eval_results.json
  adversarial_cases_path: ./tests/adversarial_cases.json
